name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Read theme revision
        id: theme
        run: |
          repo=$(sed -n 's/^repo:[[:space:]]*//p' THEME_REVISION)
          tag=$(sed -n 's/^tag:[[:space:]]*//p' THEME_REVISION)
          sha=$(sed -n 's/^sha:[[:space:]]*//p' THEME_REVISION)
          distribution=$(sed -n 's/^distribution:[[:space:]]*//p' THEME_REVISION)
          test -n "$repo" && test -n "$tag" && test -n "$sha" && test -n "$distribution"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"
          echo "主题版本 $repo $tag ($sha)"

      - name: Checkout theme source
        if: steps.theme.outputs.distribution == 'source'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.theme.outputs.repo }}
          ref: ${{ steps.theme.outputs.sha }}
          path: .theme-upstream
          fetch-depth: 1

      - name: Setup pnpm
        if: steps.theme.outputs.distribution == 'source'
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install site dependencies
        run: npm ci

      - name: Verify theme update behavior
        run: npm run test:theme

      - name: Build Hexo
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
